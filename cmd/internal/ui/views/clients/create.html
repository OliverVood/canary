{{define "content"}}
<div class = "view client create content_cower content_center">
    <form action = "/clients" method = "POST">
        <div>
            <label>
                <input type = "text" name = "login" placeholder = "Login">
            </label>
        </div>
        <div>
            <label>
                <input type = "text" name = "email" placeholder = "E-mail">
            </label>
        </div>
        <div>
            <label>
                <input type = "submit" class = "justify" onclick = "clientCreate(this.closest('form')); return false;">
            </label>
        </div>
    </form>
</div>
{{end}}
