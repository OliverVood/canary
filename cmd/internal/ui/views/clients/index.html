{{define "content"}}
<div class = "view client index content_cower">
    <div>
        <a class = "btn" href = "/clients/create">Create</a>
    </div>
    <div class  = "list">
        <table>
            <thead>
                <tr>
                    <th>N</th>
                    <th>UID</th>
                    <th colspan = "3">Action</th>
                </tr>
            </thead>
            <tbody>
                {{range $index, $item := .Data}}
                    <tr>
                        <td><span>{{$index}}</span></td>
                        <td><span>{{$item.UUID}}</span></td>
                        <td><a href = "/clients/{{$item.UUID}}">Open</a></td>
                        <td><a href = "/clients/{{$item.UUID}}/edit">Edit</a></td>
                        <td><a href = "/clients/{{$item.UUID}}" onclick = "clientDelete('/clients/{{$item.UUID}}'); return false;">Delete</a></td>
                    </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
